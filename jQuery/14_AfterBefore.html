<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery After & Before Demo</title>
  <link rel="stylesheet" href="14_AfterBefore.css">
</head>
<body>

  <h2>jQuery <code>.after()</code> & <code>.before()</code> Demo</h2>

  <div class="box" id="box1">Box 1</div>
  <div class="box" id="box2">Box 2</div>

  <br><br>

  <button id="beforeBtn">Insert Before Box 1</button>
  <button id="afterBtn">Insert After Box 2</button>
  <button id="clearBtn">Clear Inserts</button>

  <div id="output">New boxes will appear before or after the original boxes.</div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>

  <script src="14_AfterBefore.js"></script>

</body>
</html>
