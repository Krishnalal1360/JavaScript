<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery Children & Siblings Traversing Demo</title>
  <link rel="stylesheet" href="26_childrenSiblings.css">
</head>
<body>

<h2 style="text-align:center;">jQuery Children & Siblings Traversing Demo</h2>

<div class="container" id="container">
  <div class="item" id="item1">Item 1</div>
  <div class="item" id="item2">
    Item 2
    <div class="item" id="item2a">Item 2a (child)</div>
    <div class="item" id="item2b">Item 2b (child)</div>
  </div>
  <div class="item" id="item3">Item 3</div>
  <div class="item" id="item4">Item 4</div>
</div>

<div style="text-align:center;">
  <button id="childrenBtn">children()</button>
  <button id="findBtn">find()</button>
  <button id="siblingsBtn">siblings()</button>
  <button id="nextBtn">next()</button>
  <button id="nextAllBtn">nextAll()</button>
  <button id="nextUntilBtn">nextUntil()</button>
  <button id="prevBtn">prev()</button>
  <button id="prevAllBtn">prevAll()</button>
  <button id="prevUntilBtn">prevUntil()</button>
</div>

<div id="result">Click a button to see results here</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="26_childrenSiblings.js"></script>

</body>
</html>
